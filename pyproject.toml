[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcprelay"
version = "0.1.0"
description = "Local MCP gateway: aggregate upstream MCP servers behind one endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx2>=2.0",
    "PyYAML>=6.0",
    "textual>=0.80",
]

[project.scripts]
mcprelay = "mcprelay.__main__:main"

[tool.setuptools.packages.find]
include = ["mcprelay*"]
